name: Hourly Repository Health & Quality Check

on:
  schedule:
    # Run every hour on the hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hourly-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate JavaScript Syntax
        run: node -c NewScript.js

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate Python Syntax
        run: python -m py_compile downloadData.py

      - name: Verify Live Pages Site, Forecast Freshness & External Endpoints
        run: |
          python - << 'EOF'
          from datetime import datetime, timedelta, timezone
          import json
          import time
          import urllib.request

          def fetch_with_retry(url, attempts=3, timeout=20):
              last_err = None
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'WindMapHealthCheck/2.0'})
                      with urllib.request.urlopen(req, timeout=timeout) as res:
                          assert res.status == 200, f'Unexpected status {res.status} for {url}'
                          return res.read()
                  except Exception as exc:
                      last_err = exc
                      print(f'Attempt {attempt}/{attempts} failed for {url}: {exc}')
                      if attempt < attempts:
                          time.sleep(2 ** attempt)
              raise RuntimeError(f'Endpoint failed after {attempts} attempts: {url} ({last_err})')

          # 1. Verify live GitHub Pages HTML
          html = fetch_with_retry('https://sounny.github.io/windmap/').decode('utf-8', errors='replace')
          assert '<title>Wind Map' in html, 'Live site HTML missing Wind Map title'
          print('Verified live site HTML 200 OK')

          # 2. Verify live forecast.json schema, vector lengths & date freshness
          fj_bytes = fetch_with_retry('https://sounny.github.io/windmap/forecast.json')
          fj = json.loads(fj_bytes.decode('utf-8'))
          dates = fj.get('dates', [])
          vectors = fj.get('vectors', {})
          assert len(dates) >= 7, f'Expected >= 7 forecast dates, got {len(dates)}'
          assert len(vectors) == len(dates), 'Mismatch between forecast dates and vectors'

          now_utc = datetime.now(timezone.utc)
          today_utc = now_utc.strftime('%Y-%m-%d')
          yesterday_utc = (now_utc - timedelta(days=1)).strftime('%Y-%m-%d')
          assert dates[0] in (today_utc, yesterday_utc), f'Stale forecast start date: {dates[0]}'
          assert today_utc in dates or yesterday_utc in dates, f'Forecast missing current dates: {dates}'

          expected_len = 8928 * 4
          for d in dates:
              assert len(vectors.get(d, [])) == expected_len, f'Date {d} vector length mismatch'
          print(f'Verified live forecast.json ({len(dates)} days, starting {dates[0]})')

          # 3. Verify basemap tiles and Open-Meteo APIs with retries
          endpoints = [
              'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/0/0/0',
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/0/0/0',
              'https://api.open-meteo.com/v1/forecast?latitude=32.3&longitude=-64.8&current=wind_speed_10m',
              'https://geocoding-api.open-meteo.com/v1/search?name=Miami&count=1&language=en&format=json'
          ]
          for ep in endpoints:
              fetch_with_retry(ep)
              print(f'Verified 200 OK: {ep[:72]}...')
          EOF
