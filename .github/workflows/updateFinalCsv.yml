name: NOAA GFS Model Ingestion & Telemetry Refresh

on:
  schedule:
    # Run every 6 hours matching NOAA GFS forecast cycles (00Z, 06Z, 12Z, 18Z)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (ecCodes for GRIB2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run NOAA GFS Ingestion Script
        run: python downloadData.py

      - name: Commit and push updated forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forecast.json forecast.geojson
          git commit -m "chore(data): refresh NOAA GFS forecast telemetry [skip ci]" || echo "No changes to commit"
          git push
